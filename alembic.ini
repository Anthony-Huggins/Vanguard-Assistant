; Alembic configuration for the API's own database (apps/api/db).
;
; The actual DSN is *not* set here — env.py reads ``Settings.app_db_dsn``
; (which respects ``.env``) so a single config file works for sqlite-dev,
; Postgres-prod, and CI.
;
; Run from the repo root:
;     ./.venv/Scripts/python.exe -m alembic upgrade head
;     ./.venv/Scripts/python.exe -m alembic revision -m "describe change" --autogenerate

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vanguard-eval"
version = "0.1.0"
description = "Ragas evaluation harness for the Vanguard Assistant RAG pipeline."
requires-python = ">=3.11"
dependencies = [
    "ragas>=0.1.9",
    "datasets>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

# nginx config served from infra/Dockerfile.web (M10).
#
# - Static SPA at /
# - /api/*  → http://api:8000   (no Vite dev proxy in prod)
# - SSE-friendly proxy settings on /api/chat/stream + /api/chat/resume
#   (disable buffering, raise timeouts) so token events flush immediately.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — fall through to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API passthrough.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer; keep the connection open long enough for slow turns.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
